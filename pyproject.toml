[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao"
version = "0.1.0"
description = "Predict the final Brasileirão Série A standings (Libertadores top 6 and relegation Z4)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
